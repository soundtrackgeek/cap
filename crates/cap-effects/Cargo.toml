[package]
name = "cap-effects"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Color-cli inspired terminal effects for cap"

[dependencies]
crossterm = "0.29"
unicode-segmentation = "1"
unicode-width = "0.2"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
