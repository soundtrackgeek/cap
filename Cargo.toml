[workspace]
members = ["crates/cap-effects"]
resolver = "2"

[package]
name = "cap"
version = "0.2.0-dev.15"
edition = "2021"
rust-version = "1.95"
description = "A small ceremony for everyday Capsule memories"

[dependencies]
capsule-core = { git = "https://github.com/soundtrackgeek/capsule_tauri.git", rev = "d1a02b84d8f721cb389df5a7bda880b6c7d39409" }
cap-effects = { path = "crates/cap-effects" }
clap = { version = "4", features = ["derive"] }
ctrlc = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
rusqlite = { version = "0.37", features = ["backup", "bundled"] }
tempfile = "3"
