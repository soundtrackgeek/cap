[workspace]
members = ["crates/cap-effects"]
resolver = "2"

[package]
name = "cap"
version = "0.2.0-dev.29"
edition = "2021"
rust-version = "1.95"
description = "A small ceremony for everyday Capsule memories"

[features]
default = []
test-hooks = []

[dependencies]
capsule-core = { git = "https://github.com/soundtrackgeek/capsule_tauri.git", rev = "4888a2a33ab65a1833cdf5e6cbdad38baa3d4030" }
cap-effects = { path = "crates/cap-effects" }
crossterm = "0.29"
unicode-segmentation = "1"
unicode-width = "0.2"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
ctrlc = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
anyhow = "1"
chrono = "0.4"
rusqlite = { version = "0.37", features = ["backup", "bundled"] }
tempfile = "3"
