[workspace]
members = ["crates/cap-effects"]
resolver = "2"

[package]
name = "cap"
version = "0.2.0-dev.4"
edition = "2021"
rust-version = "1.85"
description = "A small ceremony for everyday Capsule memories"

[dependencies]
cap-effects = { path = "crates/cap-effects" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
rusqlite = { version = "0.37", features = ["backup", "bundled"] }
tempfile = "3"
